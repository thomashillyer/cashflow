name: Live demo deploy (Fly.io)

# Deploys the API + app (one Node service, see Dockerfile and fly.toml) to https://neri-cash.fly.dev on every
# push to main. Skips cleanly until the FLY_API_TOKEN repo secret is set (`fly tokens create deploy -a neri-cash`).
# Runtime secrets (Supabase, Anthropic) live in `fly secrets`, not in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when FLY_API_TOKEN is missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::FLY_API_TOKEN not set; skipping deploy."

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.HAS_TOKEN == 'true'

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://neri-cash.fly.dev/health && exit 0
            sleep 10
          done
          echo "::error::https://neri-cash.fly.dev/health did not answer after deploy"
          exit 1
