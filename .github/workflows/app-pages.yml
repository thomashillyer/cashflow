# Publishes app/ to GitHub Pages on every merge to main that touches it, so the whole team can open
# the current front end. It runs the built-in preview (synthetic sample businesses only, per
# docs/TECHNICAL_PLAN.md section 9). No secrets are used or published.
#
# One-time setup by a repo admin: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: App preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: app-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use preview mode on the public site
        run: |
          # The public site never points at a live API or real sign-in.
          printf 'window.NERI_API_BASE = "";\nwindow.NERI_SUPABASE_URL = "";\nwindow.NERI_SUPABASE_ANON_KEY = "";\nwindow.NERI_LOCK_MINUTES = 15;\n' > app/config.js
          rm -f app/preview.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
