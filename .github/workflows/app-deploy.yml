name: App deploy (Cloudflare)

# Publishes app/ (static, no build) as the neri-cash Cloudflare Worker (static assets; config in wrangler.jsonc).
# main -> production (neri-cash.trkhillyer.workers.dev); same-repo PRs -> a preview URL per branch.
# Skips cleanly until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set as repo secrets.
# The hosted site is public: it runs the fictional sample businesses only (config.js must stay empty).

on:
  push:
    branches: [main]
    paths: ["app/**", "wrangler.jsonc", ".github/workflows/app-deploy.yml"]
  pull_request:
    paths: ["app/**", "wrangler.jsonc", ".github/workflows/app-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork PRs get no secrets; only deploy from this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."

      - name: Refuse to publish live config
        if: env.HAS_TOKEN == 'true'
        run: |
          if grep -nE "NERI_(API_BASE|SUPABASE_URL|SUPABASE_ANON_KEY)[[:space:]]*=[[:space:]]*['\"\`][^'\"\`]" app/config.js; then
            echo "::error::app/config.js has live values; every deploy is public. Keep them empty."
            exit 1
          fi

      - name: Preview alias from branch name
        id: alias
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        # Cloudflare aliases: start with a letter, then letters/digits/dashes, end with a letter or digit.
        run: |
          a=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          case "$a" in [a-z]*) ;; *) a="pr-$PR${a:+-$a}" ;; esac
          a=$(echo "$a" | cut -c1-40 | sed -E 's/-+$//')
          echo "alias=$a" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: env.HAS_TOKEN == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: deploy

      - name: Upload PR preview
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
